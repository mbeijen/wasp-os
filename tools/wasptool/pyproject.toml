[project]
name = "wasptool"
version = "0.1.0"
description = "Talk to a wasp-os smart watch over Bluetooth: update, set the time, notify"
readme = "README.md"
license = "LGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "bleak>=3.0",
]

[project.scripts]
wasptool = "wasptool.cli:main"

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = ["tests"]
